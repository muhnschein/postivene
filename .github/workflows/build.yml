# Sends the tree to SonarQube Cloud, which reads it and reports back on
# the pull request.
#
# Its own workflow rather than a job in `ci.yml`: it needs the whole
# history (`fetch-depth: 0`) so the analysis can tell new code from old,
# and it is the one job here that talks to a service outside GitHub. What
# it analyses and what it leaves alone is `sonar-project.properties`.
#
# ci.yml is the GATE; this is a REPORT. It cannot fail a change on its own
# findings, and the quality gate it publishes is advice, not intake. That
# boundary is why the two are separate files: folding this into the gate
# would quietly make a hosted service part of the rule that a green
# `make check` on a laptop is a green CI.
#
# Every action is pinned to a commit rather than a tag: a tag can be
# moved, and this job is handed a token.
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Reading the tree is all this needs. The scanner authenticates to
# SonarQube with its own token, not with the job's, and SonarQube writes
# back to the pull request as its own GitHub App. `ci.yml` and `rpm.yml`
# say the same; a workflow with no block at all gets whatever the
# repository's default is, which is what CodeQL objects to.
permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, so SONAR_TOKEN would be
    # empty and the scan would fail on every such PR with an authentication
    # error that looks like a broken setup. Skip it instead; the analysis of
    # the merge lands when the branch reaches main.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # The same Qt set ci.yml's `test` job installs: the coverage run below
      # runs the whole suite, and the shim's tests drive a real QtQuick
      # engine. The -dev packages omit the QtQuick runtime plugin.
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtmultimedia5-dev \
            qtdeclarative5-dev-tools \
            qml-module-qtquick2 \
            qml-module-qtgraphicaleffects \
            qttools5-dev-tools

      # `toolchain` is passed explicitly because dtolnay/rust-toolchain takes
      # it from the REF NAME it was called with, and a SHA has no name. The
      # pinned commit is the head of the action's `stable` branch, whose
      # action.yml defaults to the same value -- the explicit input is what
      # keeps that readable.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-llvm-cov

      # The scanner imports coverage and clippy findings; it measures
      # neither. Without this step there is no report to import and the
      # coverage reading is a confident 0.0%.
      - name: make sonar-reports
        run: make sonar-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scan uploads a report and exits. The server processes it
      # afterwards, so without this the run finishes knowing nothing about
      # its own result -- the gate, the ratings and the issue list stay on a
      # dashboard, which neither the job log, nor a reviewer, nor anything
      # whose network policy stops at sonarcloud.io can reach.
      #
      # continue-on-error, and never `sonar.qualitygate.wait`: this reports
      # and does not gate. A Sonar outage costs a warning here, not a build.
      - name: What SonarQube made of it
        if: always()
        continue-on-error: true
        env:
          # Only used if the project is private; the endpoints are readable
          # without it on a public one. See the script.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/sonar-report.sh
