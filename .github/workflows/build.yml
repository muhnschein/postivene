# Sends the tree to SonarQube Cloud, which reads it and reports back on
# the pull request.
#
# Its own workflow rather than a job in `ci.yml`: it needs the whole
# history (`fetch-depth: 0`) so the analysis can tell new code from old,
# and it is the one job here that talks to a service outside GitHub. What
# it analyses and what it leaves alone is `sonar-project.properties`.
#
# Both actions are pinned to a commit rather than a tag: a tag can be
# moved, and this job is handed a token.
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
