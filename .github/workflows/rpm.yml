# Builds a device RPM inside the Sailfish SDK.
#
# Not part of `ci.yml`: it pulls a multi-gigabyte SDK image and cross-compiles
# the whole workspace, which is minutes of runner time nobody wants on every
# push. Run it from the Actions tab when a package is wanted, or on a tag.
#
# The SDK is what makes the result runnable on a phone: the app links against
# the target's Qt 5.6 and glibc, and a host-built binary has neither. See
# docs/SDK-BUILD.md.
name: rpm

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Device architecture
        type: choice
        options: [aarch64, armv7hl]
        default: aarch64
      sfos_version:
        description: >
          Sailfish SDK version to build against. Build against the oldest
          release you want to support: a binary from a newer SDK can call
          symbols an older phone does not have.
        type: string
        default: "4.6.0.13"
  push:
    # `v*` for a release. `build-*` is a throwaway handle for running this
    # before it reaches the default branch, since workflow_dispatch only
    # becomes available once a workflow is on main.
    tags: ["v*", "build-*"]

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      SFOS: ${{ inputs.sfos_version || '4.6.0.13' }}
    steps:
      - uses: actions/checkout@v4

      # Bundled beside the app; checksum-pinned by the script itself.
      - name: Fetch deltachat-rpc-server
        run: ./scripts/fetch-rpc-server.sh

      - name: Pull the Sailfish SDK
        run: docker pull coderus/sailfishos-platform-sdk:$SFOS

      # The image ships one target per architecture, named by the SDK's own
      # convention. Asked for rather than assumed, so a version whose naming
      # differs fails here with the list rather than deep inside rpmbuild.
      - name: Resolve the build target
        run: |
          targets=$(docker run --rm coderus/sailfishos-platform-sdk:$SFOS \
              sb2-config -l 2>/dev/null || true)
          echo "available targets:"; echo "$targets"
          target=$(echo "$targets" | grep -- "-$ARCH\$" | tail -1)
          if [ -z "$target" ]; then
            echo "::error::no $ARCH target in the $SFOS SDK image; see the list above"
            exit 1
          fi
          echo "Building against $target"
          echo "TARGET=$target" >> "$GITHUB_ENV"

      # Running as root is explicitly wrong -- sdk-manage refuses, saying
      # it cannot determine the Mer SDK user -- so the build stays as the
      # image's own mersdk, and the tree has to belong to it.
      - name: Hand the checkout to the SDK's build user
        run: |
          img=coderus/sailfishos-platform-sdk:$SFOS
          uid=$(docker run --rm "$img" id -u)
          gid=$(docker run --rm "$img" id -g)
          home=$(docker run --rm "$img" sh -c 'echo $HOME')
          echo "SDK builds as uid=$uid gid=$gid, HOME=$home"
          echo "BUILDDIR=$home/postivene" >> "$GITHUB_ENV"
          sudo chown -R "$uid:$gid" "$PWD"

      # Mounted inside the SDK user's home, and that placement is the
      # whole fix. rpm runs under scratchbox2, which redirects absolute
      # paths it does not recognise into the target rootfs -- so with the
      # tree at /build/postivene, mb2 wrote .mb2/spec (the file is right
      # there afterwards, 10 KB of it) and rpm then looked for the same
      # path inside the target and found nothing:
      #
      #   error: Unable to open /build/postivene/.mb2/spec: No such file
      #
      # A file that exists and cannot be opened is two different roots.
      # docs/SDK-BUILD.md bind-mounted under /home/mersdk for this
      # reason. The directory keeps the project's name either way: mb2
      # derives the package from it, so rpm/postivene.spec is found.
      #
      # `build-init` because mb2's help says a build directory is
      # initialised before it is built in, and `-X` (--no-fix-version)
      # because otherwise build-init asks `git describe` for a version,
      # finds no tags here, and stops before writing the spec at all.
      # `--no-check` matches that document too; the spec has no %check.
      #
      # Deliberately *not* passing its `-n` / `--nodeps`: those are its
      # offline workaround. A runner reaches the Jolla repositories, so
      # mb2 can zypper-install rust, cargo and rust-std-static into the
      # target the way it is meant to.
      - name: Build the RPM
        run: |
          docker run --rm --privileged \
            -v "$PWD:$BUILDDIR" -w "$BUILDDIR" \
            coderus/sailfishos-platform-sdk:$SFOS \
            /bin/bash -c "set -e
              mb2 -t '$TARGET' -X build-init
              mb2 -t '$TARGET' -X build-requires || true

              # Build scripts and proc-macros are compiled for the SDK's
              # own i686 and linked in sb2's *host* mode, where /usr is
              # the SDK filesystem rather than the target -- so the i686
              # rustlib has to exist there too, not only where rust was
              # installed. docs/SDK-BUILD.md names this exact failure.
              echo '--- rustlib available ---'
              ls -d /srv/mer/toolings/*/usr/lib/rustlib/* \
                    /srv/mer/targets/*/usr/lib/rustlib/* 2>/dev/null || true
              host=i686-unknown-linux-gnu
              src=\$(ls -d /srv/mer/toolings/*/usr/lib/rustlib/\$host 2>/dev/null | head -1 || true)
              [ -n \"\$src\" ] || src=\$(ls -d /srv/mer/targets/*/usr/lib/rustlib/\$host 2>/dev/null | head -1 || true)
              if [ -n \"\$src\" ] && [ ! -d /usr/lib/rustlib/\$host ]; then
                sudo mkdir -p /usr/lib/rustlib
                sudo cp -a \"\$src\" /usr/lib/rustlib/
                echo \"grafted \$src into /usr/lib/rustlib/\"
              fi

              mb2 -t '$TARGET' -X build --no-check"

      - name: Show mb2's state
        if: failure()
        run: ls -la .mb2 2>/dev/null; tail -60 .mb2/*.log 2>/dev/null || true

      # Back to the runner, or the upload cannot read what was built.
      - name: Take the tree back
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$PWD"

      - name: Show what was built
        run: |
          find RPMS -name '*.rpm' -print -exec rpm -qip {} \; 2>/dev/null || \
            find . -name '*.rpm' -print

      - uses: actions/upload-artifact@v4
        with:
          name: postivene-${{ env.ARCH }}-sfos${{ env.SFOS }}
          path: |
            RPMS/**/*.rpm
            **/*.rpm
          if-no-files-found: error
          retention-days: 30
