# Harbour rules this package knowingly breaks, and why. Nothing belongs
# here that can be fixed: every entry is a submission blocker, and
# docs/HARBOUR.md says what each one is for.
#
#     <check id>  <subject glob>  <message glob>   # reason
#
# ci/harbour-check.sh matches its own findings on the id and the subject.
# ci/harbour-validate-rpm.sh matches the real validator's subject *and*
# message, so a waiver excuses one known error about a path and never
# every error the validator might raise about it. Both are bash globs. A
# waiver that matches nothing fails the source check, so this file cannot
# outlive what it excuses.

# deltachat-rpc-server is an ELF executable, and Harbour allows ELF files
# only at /usr/bin/<NAME> or as *.so under /usr/share/<NAME>/lib/. The app
# spawns it and talks JSON-RPC over stdio, so it cannot simply move to
# /usr/bin. There is no fix in this tree: upstream's libdeltachat.so would
# satisfy the rule but is on its way out, and the Rust API that replaces it
# cannot be built with the Rust the SDK ships. docs/HARBOUR.md §"The open
# blocker" has the analysis.
1.2.1  /usr/libexec/harbour-postivene    Installation not allowed*      # bundled deltachat-rpc-server
1.2.1  /usr/libexec/harbour-postivene/*  Installation not allowed*      # bundled deltachat-rpc-server
1.6.7  /usr/libexec/harbour-postivene/*  ELF binary in wrong location*  # bundled deltachat-rpc-server
1.6.7  /usr/libexec/harbour-postivene/*  File must not be executable*   # bundled deltachat-rpc-server

# The app's page in the system's Settings app is one JSON file under
# /usr/share/jolla-settings/entries/, which is where the Settings app
# looks and nowhere Harbour allows a file. The settings on that page
# belong to the app as a whole rather than to a profile, and the reader
# expects to find them where every other app's are. docs/HARBOUR.md
# §"The open blockers" has the analysis.
1.2.1  /usr/share/jolla-settings/entries/harbour-postivene.json  Installation not allowed*  # Settings-app entry
