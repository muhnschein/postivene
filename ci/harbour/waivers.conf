# deltachat-rpc-server is an ELF executable, and Harbour allows ELF files
# only at /usr/bin/<NAME> or as *.so under /usr/share/<NAME>/lib/. The app
# spawns it and talks JSON-RPC over stdio, so it cannot simply move to
# /usr/bin. The clean fix is upstream's libdeltachat.so, whose dc_jsonrpc_*
# API carries the same protocol -- which needs it cross-built against a
# Sailfish sysroot with Rust >= 1.89, since a shared library cannot use the
# static-musl build that makes the current binary portable.
1.2.1  /usr/libexec/harbour-postivene            # bundled deltachat-rpc-server
1.2.1  /usr/libexec/harbour-postivene/*          # bundled deltachat-rpc-server
1.6.7  /usr/libexec/harbour-postivene/*          # bundled deltachat-rpc-server

# qmetaobject-rs builds its QML engine on QApplication, from QtWidgets,
# which Harbour's allowed-libraries list does not carry -- QtGui's
# QGuiApplication is what a Silica app is meant to use. Both the include
# and the `link_lib("Widgets")` in qttypes' build script are unconditional,
# in the released crates and on upstream master, so nothing in this tree
# can drop the dependency; it takes a patched qmetaobject and a patched
# qttypes.
1.6.1  libQt5Widgets.so.5                        # qmetaobject-rs uses QApplication
