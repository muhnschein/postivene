# deltachat-rpc-server is an ELF executable, and Harbour allows ELF files
# only at /usr/bin/<NAME> or as *.so under /usr/share/<NAME>/lib/. The app
# spawns it and talks JSON-RPC over stdio, so it cannot simply move to
# /usr/bin. There is no fix in this tree: upstream's libdeltachat.so would
# satisfy the rule but is on its way out, and the Rust API that replaces it
# cannot be built with the Rust the SDK ships. docs/HARBOUR.md.
1.2.1  /usr/libexec/harbour-postivene            # bundled deltachat-rpc-server
