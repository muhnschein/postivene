# cargo-deny policy. The licence half is the one that matters here:
# Postivene is MPL-2.0 and ships alongside a GPL-family core binary, so a
# dependency arriving under an incompatible licence is a distribution
# problem rather than a preference (see docs/LICENSING.md).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences plus MPL-2.0 (our own). Anything outside this list
# needs a deliberate review, which is the point of listing them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
