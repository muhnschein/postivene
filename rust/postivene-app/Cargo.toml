[package]
name = "postivene-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Binary that wires DeltaChatCore + the chat/message list models into a QmlEngine and loads the Silica UI from qml/."

[dependencies]
postivene-shim = { path = "../postivene-shim" }
qmetaobject = "0.2"

[[bin]]
name = "postivene"
path = "src/main.rs"
