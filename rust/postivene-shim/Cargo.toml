[package]
name = "postivene-shim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Qt/QML integration layer: exposes DeltaChatCore as a QObject and chat/message lists as QAbstractListModel for use from Silica QML. Depends on Qt5 via qmetaobject-rs."

[dependencies]
deltachat-jsonrpc = { path = "../deltachat-jsonrpc" }
qmetaobject = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "macros"] }

[[bin]]
name = "fake-health-server"
path = "src/bin/fake_health_server.rs"
test = false
doc = false

# The recording double the onboarding tests drive. See its module docs for
# why the journal exists.
[[bin]]
name = "fake-core-server"
path = "src/bin/fake_core_server.rs"
test = false
doc = false

[lints]
workspace = true
