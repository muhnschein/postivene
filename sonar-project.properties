# What SonarQube Cloud is told about this project, read by the scanner
# .github/workflows/build.yml runs.
#
# The key and the organisation, because nothing can work those out; the
# rest is left to the scanner's own defaults. Sources default to the
# checkout, and the encoding to the system's, which is UTF-8 on the
# runner and in this tree.
sonar.projectKey=muhnschein_postivene
sonar.organization=muhnschein

# What is in the tree but is not this project's to answer for: the crates
# vendored for an offline build (scripts/vendor-crates.sh), the patched
# qmetaobject the shim builds against, and whatever cargo has left
# behind. Without this the report is mostly somebody else's code.
sonar.exclusions=vendor/**,third_party/**,rust/target/**
