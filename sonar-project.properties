# What SonarQube Cloud is told about this project, read by the scanner
# .github/workflows/build.yml runs.
#
# It is a REPORT, not a gate. `make check` and ci.yml decide what is allowed
# in, and nothing here can turn a red build green or a green build red.
#
# Coverage is produced by `make sonar-reports` rather than by the scanner
# itself. The reason is with the property, at the bottom.
sonar.projectKey=muhnschein_postivene
sonar.organization=muhnschein
sonar.projectName=postivene

sonar.sourceEncoding=UTF-8

# The whole tree, minus the exclusions below, rather than a list of source
# directories: the secrets detector runs over files no language analyser
# claims -- the spec file, the desktop entry, the shell scripts under ci/
# and scripts/ -- and those are exactly the files a token gets pasted into.
sonar.sources=.

# Test code, separated so that coverage and duplication are measured on the
# application and not on its fixtures.
#
# This matters more here than in most trees: there are about 28,000 lines of
# test to 14,500 lines of application, because the project's rule is that
# test volume exceeds source volume. Indexed as main sources, the fixtures
# were most of what every ratio was computed over.
#
# It catches less than it looks like it does: Rust's unit tests live in
# `#[cfg(test)]` modules INSIDE the files they test, and there is no moving
# them. What it does catch is the integration tests and the QML doubles under
# tests/silica-stubs -- which is where near-identical code is supposed to be.
#
# A file may not be in both sets, so every path here appears in
# sonar.exclusions as well. The scanner's complaint when it does not is
# "File X can't be indexed twice".
sonar.tests=rust/deltachat-jsonrpc/tests,rust/postivene-shim/tests,tests

sonar.exclusions=\
    vendor/**,\
    third_party/**,\
    **/target/**,\
    translations/**,\
    icons/**,\
    rust/deltachat-jsonrpc/tests/**,\
    rust/postivene-shim/tests/**,\
    tests/**,\
    **/*.png

# What is in the tree but is not this project's to answer for:
#
# vendor/ is the crates vendored for an offline build (scripts/vendor-crates.sh)
# and third_party/ the patched qmetaobject the shim builds against. Their
# defects are upstream's, and reporting them here buries ours under code
# nobody in this repository may fix. **/target/** is whatever cargo left.
#
# translations/ is generated by lupdate, and its files are the reason this
# line is not optional: a Qt catalogue is named .ts, so the scanner indexes
# thirty-nine of them as TypeScript. They are XML. Near-identical XML, at
# that, which is duplication measured on a machine's output.
#
# icons/ is rendered artwork, and the PNGs cost a scan each and print
# "Invalid character encountered ... for encoding UTF-8" on every run --
# lines of warning that mean nothing and train the reader to skim the log.

# --- Rust ---------------------------------------------------------------
#
# The Sonar Rust analyser can run Clippy itself, and that is switched off
# because it would not run the clippy that gates this project -- or any
# clippy at all. It invokes cargo where it finds the project, and this
# repository's workspace is under rust/, not at the root.
#
# Nor is a clippy report handed over in its place. `make lint` runs clippy
# with `-D warnings`, so a warning in this project's own code fails the gate
# and never reaches a branch this analyses. A report was produced for one
# commit and held four diagnostics, all of them in third_party/qmetaobject,
# which is excluded above.
#
# Sonar's own Rust rules are unaffected by this: it disables the external
# Clippy pass, not the analyser.
sonar.rust.clippy.enabled=false

# Coverage, from `cargo llvm-cov`, written by `make sonar-reports`.
#
# The scanner never measures coverage; it only imports a report. Without this
# and the target that writes it, the reading is a confident 0.0% rather than
# "no data" -- which is what it read here for as long as there was no report
# at all. Absent reports are a warning in the scanner log, not a failure, so
# a run that skipped them degrades to "no coverage data" rather than breaking.
sonar.rust.lcov.reportPaths=rust/target/sonar/lcov.info

# Nothing under qml/ can have coverage data: the .qml files are not a
# language the scanner reads, and the .js beside them run inside Qt's
# engine or the webxdc WebView, neither of which has a coverage tool.
#
# Left in, one changed line of qml/js/Format.js was the only "new line to
# cover" in a pull request, so new coverage read 0.0% and the gate went
# red on a change Sonar itself had asked for. Shell and YAML never count
# as coverable, which is why the gate stayed quiet on earlier pull
# requests that touched only those.
#
# Excluded from coverage, not from analysis: their issues still count.
sonar.coverage.exclusions=qml/**
